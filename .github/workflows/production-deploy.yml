# Production Deploy — triggered by the GitHub Release that release-tag.yml
# publishes after a next → main merge. Deploys the tagged commit to Vercel.
name: Production Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Deploy production to Vercel
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret is not set on the production environment"; exit 1; }
          bunx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          bunx vercel build --prod --token="$VERCEL_TOKEN"
          url=$(bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Production ($RELEASE_TAG) deployed: $url" >> "$GITHUB_STEP_SUMMARY"
