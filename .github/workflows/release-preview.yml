# A rolling Vercel preview of the open release branch.
#
# Replaces the old `next` preview: in this model the release branch is what
# accumulates merged features, so it is the branch worth having a live URL for.
# One preview per release, refreshed on every merge into it.
#
# `pr.yml` already ran the full suite on whatever landed here, so this only
# builds and deploys.
name: Release preview

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  INSTALL_FLAGS: --frozen-lockfile

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # A missing token means previews were never configured — that is a
      # skipped step with a note, not a red branch.
      - name: Note that preview deploys are unconfigured
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          {
            echo "### Preview skipped"
            echo
            echo "\`VERCEL_TOKEN\` is not set on the \`preview\` environment."
          } >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ env.VERCEL_TOKEN != '' }}
        run: make install

      - name: Deploy preview to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: make deploy-preview
