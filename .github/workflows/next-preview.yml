# Preview CI — validates next and deploys a Vercel preview.
# On success, next-to-main-release-pr.yml opens the next → main release PR.
name: Preview CI

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-next
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Deploy preview to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          set -euo pipefail
          bunx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          bunx vercel build --token="$VERCEL_TOKEN"
          url=$(bunx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"
