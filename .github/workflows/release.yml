# A release PR landed on main: deploy it, then open the next release branch.
#
# Nothing is re-tested here — the exact tree being deployed already passed
# `check` and `package` on the release PR.
#
# The deploy lives in this workflow rather than hanging off the GitHub Release:
# `make tag-release` creates that Release with GITHUB_TOKEN, and events raised
# by GITHUB_TOKEN do not start new workflow runs, so a `release: [published]`
# trigger would sit there and never fire.
#
# The dispatch is the bootstrap: it opens a release branch without a preceding
# deploy, which is how the first one (and any manual re-cut) gets created.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump for the next release branch
        default: minor
        type: choice
        options: [major, minor, patch]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  INSTALL_FLAGS: --frozen-lockfile

jobs:
  deploy:
    name: deploy
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    # VERCEL_TOKEN lives in this environment.
    environment: production
    permissions:
      contents: write # create the tag and the GitHub Release
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: make install

      - name: Deploy to Vercel
        run: make deploy

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: make tag-release

      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: make delete-branch

  next-release:
    name: next-release
    needs: [deploy]
    # `deploy` is skipped on a manual dispatch, which is exactly the bootstrap
    # case — so run whenever it did not actually fail.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.deploy.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # Full history and tags: `make next-version` reads the newest vX.Y.Z tag.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup

      - name: Open the next release branch
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
        run: |
          git config user.name  "corpora-automation[bot]"
          git config user.email "corpora-automation[bot]@users.noreply.github.com"
          make release-branch
